    <style>
      :root{
        --night:#1C0A4A;
        --lavLight:#C9BDE3;
        --cream:#FBF7EE;
        --gold:#F2C14E;
        --goldFlap:#E5AE38;
        --goldLine:#D99F2B;
        --goldText:#7A4E06;
      }

      *{ box-sizing:border-box; margin:0; -webkit-tap-highlight-color: transparent; }

      html, body{ min-height:100%; }

      /* Same look as the Meta ads: flat night purple, Montserrat, thin + extra-bold headline. */
      body{
        background:var(--night);
        color:#fff;
        font-family: Montserrat, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        min-height:100vh;
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding: calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      }

      .top{ display:flex; align-items:center; gap:10px; align-self:flex-start; }
      .top img{ width:34px; height:34px; border-radius:9px; background:#fff; display:block; }
      .top span{ font-weight:800; font-size:17px; letter-spacing:-0.2px; }

      .spacer{ flex:1; min-height:28px; }

      h1{
        text-align:center;
        font-size:32px;
        line-height:1.15;
        letter-spacing:-0.6px;
        font-weight:400;
      }
      h1 b{ font-weight:800; display:block; }

      /* Gold envelope, the joker as a gift from a friend. */
      .env{ position:relative; width:100%; max-width:330px; aspect-ratio:1.55; margin-top:40px; transform:rotate(-3deg); }
      .env .body{ position:absolute; inset:0; background:var(--gold); border-radius:10px; overflow:hidden; box-shadow:0 18px 40px rgba(0,0,0,0.35); }
      .env .flap{ position:absolute; left:0; right:0; top:0; height:58%; background:var(--goldFlap); clip-path:polygon(0 0,100% 0,50% 100%); }
      .env .lines{
        position:absolute; inset:0;
        background:
          linear-gradient(to top right, transparent calc(50% - 1px), var(--goldLine) 50%, transparent calc(50% + 1px)) left bottom / 50% 62% no-repeat,
          linear-gradient(to top left, transparent calc(50% - 1px), var(--goldLine) 50%, transparent calc(50% + 1px)) right bottom / 50% 62% no-repeat;
      }
      .seal{
        position:absolute; left:50%; top:58%;
        width:56px; height:56px; margin:-28px 0 0 -28px;
        border-radius:50%; background:#fff; overflow:hidden;
        display:flex; align-items:center; justify-content:center;
        box-shadow:0 3px 8px rgba(122,78,6,0.35);
      }
      .seal img{ width:46px; height:46px; display:block; }
      .stamp{
        position:absolute; right:14px; top:16px; transform:rotate(6deg);
        border:2.5px solid var(--goldText); color:var(--goldText); background:var(--gold);
        border-radius:8px; padding:6px 10px;
        font-weight:800; font-size:13px; letter-spacing:1.2px; text-align:center; line-height:1.25;
      }

      .storeBtn{
        display:flex; align-items:center; justify-content:center;
        width:100%; max-width:360px; min-height:56px;
        border-radius:16px; background:var(--cream); color:var(--night);
        font-weight:800; font-size:17px; text-decoration:none;
      }
      .storeBtn:active{ opacity:0.9; }

      .openLink{
        margin-top:18px;
        color:#fff; font-weight:600; font-size:15px; text-decoration:none;
        border-bottom:1.5px solid rgba(201,189,227,0.6); padding-bottom:2px;
      }
      .openLink[hidden]{ display:none; }

      footer{ margin-top:26px; font-size:13px; color:rgba(201,189,227,0.75); font-weight:500; text-align:center; }
      footer a{ color:inherit; }
    </style>
  </head>
  <body>
    <div class="top"><img src="/assets/logo.png" alt="" /><span>DailyQ</span></div>

    <div class="spacer"></div>

    <h1>Je vriend(in) stuurt je<b>een gratis joker.</b></h1>

    <div class="env" aria-hidden="true">
      <div class="body"><div class="flap"></div><div class="lines"></div></div>
      <div class="stamp">1 JOKER<br>GRATIS</div>
      <div class="seal"><img src="/assets/logo.png" alt="" /></div>
    </div>

    <div class="spacer"></div>

    <a id="storeBtn" class="storeBtn" href="https://apps.apple.com/app/id6759645677" aria-label="Download DailyQ">Download DailyQ</a>

    <a id="openBtn" class="openLink" href="dailyq://" hidden>Ik heb DailyQ al</a>

    <footer>© 2026 DailyQ · <a href="https://tjadevz.github.io/dailyq-legal/" target="_blank" rel="noopener noreferrer">Privacy &amp; voorwaarden</a></footer>

    <script>
      (function () {
        var appStoreUrl = "https://apps.apple.com/app/id6759645677";
        // Shared links look like /join/?c=<code> (a real page, so WhatsApp & co. get a 200 and
        // render the preview card). Older /invite/<code> links are served by 404.html.
        var match = String(window.location.search || "").match(/[?&]c=([^&#]+)/);
        var code = match ? decodeURIComponent(match[1]).trim().toLowerCase() : "";

        // Matches server-generated referral codes (see generate_referral_code): 8 chars, a-z0-9.
        if (!/^[a-z0-9]{8}$/.test(code)) return;

        // No automatic redirects or scheme launches on load: Safari would show an
        // "Open in DailyQ?" sheet. Everything happens on a tap.

        // Copying needs a user tap in Safari, so it happens in the button's click handler.
        // The fresh install reads the code back from the clipboard on first launch.
        function copyCode() {
          var copied = false;
          try {
            var ta = document.createElement("textarea");
            ta.value = code;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.top = "0";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.focus();
            ta.setSelectionRange(0, code.length);
            copied = document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (e) {}
          if (copied || !navigator.clipboard || !navigator.clipboard.writeText) {
            return Promise.resolve();
          }
          return navigator.clipboard.writeText(code).catch(function () {});
        }

        var storeBtn = document.getElementById("storeBtn");
        storeBtn.addEventListener("click", function (e) {
          e.preventDefault();
          var go = function () { window.location.href = appStoreUrl; };
          var t = window.setTimeout(go, 600);
          copyCode().then(function () { window.clearTimeout(t); go(); });
        });

        // People who already have the app land here too (this path is not a universal link),
        // so they open the app with the custom scheme, which every app version handles.
        var openBtn = document.getElementById("openBtn");
        openBtn.href = "dailyq://invite/" + encodeURIComponent(code);
        openBtn.hidden = false;
      })();
    </script>
  </body>
