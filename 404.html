<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#8B5CF6" />
    <title>DailyQ · Referral</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --primary: #8B5CF6;
        --dark: #7C3AED;
        --light: #A78BFA;
        --soft: #DDD6FE;
        --text: #1F2937;
        --muted: #6B7280;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(220px 220px at 14% 22%, rgba(139, 92, 246, 0.08), rgba(139, 92, 246, 0)),
          radial-gradient(180px 180px at 88% 76%, rgba(167, 139, 250, 0.08), rgba(167, 139, 250, 0)),
          linear-gradient(to bottom, #FAFAFF, #F2F4FF);
        padding: 20px 14px 18px;
      }
      .layout {
        max-width: 420px;
        margin: 0 auto;
      }
      .introSection {
        padding: 14px 2px 12px;
        text-align: center;
      }
      .logoWrap {
        position: relative;
        width: 160px;
        height: 160px;
        margin: 0 auto 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .haloOuter,
      .haloInner {
        position: absolute;
        border-radius: 999px;
      }
      .haloOuter {
        width: 160px;
        height: 160px;
        background: rgba(139, 92, 246, 0.12);
      }
      .haloInner {
        width: 130px;
        height: 130px;
        background: rgba(167, 139, 250, 0.15);
      }
      .logoMark {
        position: relative;
        width: 110px;
        height: 110px;
        margin-top: 16px;
      }
      .introTitle {
        margin: 0 0 10px;
        font-size: 32px;
        line-height: 1.2;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.4px;
      }
      .introSub {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        color: var(--muted);
      }
      .answersCard {
        margin-top: 22px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 255, 255, 1);
        border-radius: 32px;
        box-shadow: 0 20px 25px rgba(124, 58, 237, 0.15);
        backdrop-filter: blur(10px);
        padding: 20px;
        text-align: center;
      }
      .loading {
        margin: 10px auto 0;
        width: fit-content;
        padding: 10px 14px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        background: rgba(237, 233, 254, 0.55);
        border: 1px solid rgba(139, 92, 246, 0.12);
        color: #5B21B6;
        font-size: 14px;
        font-weight: 700;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
        animation: pulse 1.05s infinite ease-in-out;
      }
      .dot:nth-child(2) { animation-delay: 0.12s; opacity: 0.85; }
      .dot:nth-child(3) { animation-delay: 0.24s; opacity: 0.75; }
      @keyframes pulse {
        0%, 100% { transform: translateY(0); opacity: 0.65; }
        50% { transform: translateY(-3px); opacity: 1; }
      }
      .storeBtn {
        display: inline-flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border-radius: 999px;
        min-height: 56px;
        margin-top: 16px;
        padding: 16px 26px;
        font-size: 16px;
        font-weight: 600;
        color: #FFF;
        background: linear-gradient(to right, #7C3AED, #6D28D9);
        box-shadow: 0 20px 56px rgba(139, 92, 246, 0.35);
      }
      .storeBtn:active { opacity: 0.9; }
      .legal {
        margin-top: 16px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        font-weight: 700;
      }
      .legal a {
        color: var(--dark);
        text-decoration: none;
        border-bottom: 1px solid rgba(124, 58, 237, 0.35);
      }
      @media (max-width: 360px) {
        .introTitle { font-size: 28px; }
        .answersCard { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="introSection">
        <div class="logoWrap" aria-hidden="true">
          <div class="haloOuter"></div>
          <div class="haloInner"></div>
          <svg class="logoMark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="qg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#A78BFA"></stop>
                <stop offset="1" stop-color="#8B5CF6"></stop>
              </linearGradient>
            </defs>
            <circle cx="60" cy="60" r="50" fill="url(#qg)" opacity="0.22"></circle>
            <path d="M84 88 67 71c-3 2-6 3-10 3-11 0-20-9-20-20s9-20 20-20 20 9 20 20c0 4-1 7-3 10l17 17-7 7Z" fill="#7C3AED"></path>
            <path d="M58 44c-6 0-10 4-10 10s4 10 10 10 10-4 10-10-4-10-10-10Z" fill="#8B5CF6"></path>
          </svg>
        </div>
        <h1 class="introTitle">Welcome to DailyQ</h1>
        <p class="introSub">Opening your referral…</p>
      </section>

      <section class="answersCard">
        <p class="introSub">If it doesn't open, we'll take you to the App Store.</p>
        <div class="loading" aria-hidden="true">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span>Redirecting</span>
        </div>
        <a class="storeBtn" href="https://apps.apple.com/app/id6759645677" aria-label="Download DailyQ from the App Store">
          Download DailyQ
        </a>
      </section>

      <footer class="legal">
        © 2026 DailyQ ·
        <a href="https://tjadevz.github.io/dailyq-legal/" target="_blank" rel="noopener noreferrer">Privacy &amp; Terms</a>
      </footer>
    </main>

    <script>
      (function () {
        var appStoreUrl = "https://apps.apple.com/app/id6759645677";

        function getInviteCode() {
          var path = (window.location && window.location.pathname) ? String(window.location.pathname) : "";
          var parts = path.split("/").filter(Boolean);
          var inviteIndex = parts.indexOf("invite");
          if (inviteIndex !== -1 && parts[inviteIndex + 1]) return parts[inviteIndex + 1];
          return parts[parts.length - 1] || "";
        }

        var path = (window.location && window.location.pathname) ? String(window.location.pathname) : "";
        var isInvitePath = path.indexOf("/invite/") === 0;
        var code = getInviteCode();

        // Only attempt deep-linking for referral-like paths.
        var deepLink = isInvitePath ? ("dailyq://invite/" + encodeURIComponent(code)) : appStoreUrl;

        var fallbackTimer = null;
        var stopped = false;
        function stopAndClear() {
          if (stopped) return;
          stopped = true;
          if (fallbackTimer) window.clearTimeout(fallbackTimer);
        }

        var isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent);
        var delayMs = isIOS ? 6500 : 2500;

        fallbackTimer = window.setTimeout(function () {
          stopAndClear();
          window.location.replace(appStoreUrl);
        }, delayMs);

        window.addEventListener("blur", stopAndClear, { once: true });
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") stopAndClear();
        }, { passive: true });
        window.addEventListener("pagehide", stopAndClear, { once: true });

        try {
          if (isInvitePath) {
            window.location.href = deepLink;
          } else {
            window.location.replace(appStoreUrl);
          }
        } catch (e) {
          window.location.replace(appStoreUrl);
        }
      })();
    </script>
  </body>
</html>
